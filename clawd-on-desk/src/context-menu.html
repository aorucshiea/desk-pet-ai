<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; }
  #menu {
    background: rgba(24, 25, 34, 0.96);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    padding: 5px;
    opacity: 0;
    transform: scale(0.97) translateY(-2px);
    transition: opacity 110ms ease, transform 110ms ease;
    min-width: 200px;
  }
  #menu.show { opacity: 1; transform: scale(1) translateY(0); }
  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 8px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #d5d9e6;
    cursor: default;
    white-space: nowrap;
  }
  .item:hover:not(.disabled) { background: rgba(124, 108, 247, 0.22); color: #ffffff; }
  .item.danger:hover:not(.disabled) { background: rgba(235, 90, 90, 0.2); color: #ff9a9a; }
  .item.disabled { opacity: 0.38; }
  .item .icon { font-size: 13px; width: 18px; text-align: center; flex: 0 0 auto; }
  .item .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .item .check { color: #8f7bff; font-weight: 600; flex: 0 0 auto; }
  .sep { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 4px 8px; }
</style>
</head>
<body>
<div id="menu"></div>
<script>
  const { onItems, sendClick, sendClose, sendSize } = window.contextMenuBridge;
  const menu = document.getElementById("menu");
  let count = 0;

  function render(items) {
    menu.innerHTML = "";
    count = 0;
    for (const it of items) {
      // CRITICAL: count must advance for separators too — the main process
      // looks up click handlers by the FULL item index. Rendering rows only
      // shifted every index after the first separator by one (clicking
      // "Dashboard" triggered "auto-approve", clicking anything after a
      // separator did nothing).
      if (it.type === "separator") {
        const s = document.createElement("div");
        s.className = "sep";
        menu.appendChild(s);
        count++;
        continue;
      }
      const idx = count;
      count++;

      const row = document.createElement("div");
      row.className = "item" + (it.danger ? " danger" : "") + (it.disabled ? " disabled" : "");
      if (it.icon) {
        const ic = document.createElement("span");
        ic.className = "icon";
        ic.textContent = it.icon;
        row.appendChild(ic);
      }
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = it.label;
      row.appendChild(label);
      if (it.checked) {
        const chk = document.createElement("span");
        chk.className = "check";
        chk.textContent = "✓";
        row.appendChild(chk);
      }
      if (!it.disabled) {
        row.addEventListener("click", () => { sendClick(idx); });
        row.addEventListener("mouseenter", () => { row.style.background = it.danger ? "rgba(235,90,90,0.2)" : "rgba(124,108,247,0.22)"; });
        row.addEventListener("mouseleave", () => { row.style.background = ""; });
      }
      menu.appendChild(row);
    }
    // Fade in — without this the menu renders at opacity:0 (invisible
    // window over the desktop = "right-click does nothing").
    requestAnimationFrame(() => {
      sendSize(menu.offsetWidth, menu.offsetHeight);
      menu.classList.add("show");
    });
  }

  window.addEventListener("keydown", (e) => { if (e.key === "Escape") sendClose(); });
  window.addEventListener("blur", () => sendClose());
  onItems((items) => { render(items); });
</script>
</body>
</html>
