<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; }
  #menu {
    background: rgba(27, 28, 34, 0.98);
    backdrop-filter: blur(20px) saturate(130%);
    -webkit-backdrop-filter: blur(20px) saturate(130%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    padding: 4px;
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 90ms ease, transform 90ms ease;
    min-width: 184px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #menu.show { opacity: 1; transform: scale(1); }
  .item {
    display: flex; align-items: center; gap: 10px;
    height: 28px;
    padding: 0 9px;
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1;
    color: #c9cdd8;
    cursor: default;
    white-space: nowrap;
  }
  .item:hover:not(.disabled) { background: rgba(255, 255, 255, 0.07); color: #ffffff; }
  .item:hover:not(.disabled) .icon { opacity: 1; }
  .item.danger:hover:not(.disabled) { background: rgba(235, 90, 90, 0.14); color: #ff8f8f; }
  .item.disabled { opacity: 0.35; }
  .item .icon {
    flex: 0 0 16px; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.62; transition: opacity 90ms ease;
  }
  .item .icon svg { width: 15px; height: 15px; display: block; }
  .item .label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .item .check { color: #7aa2ff; font-size: 12px; flex: 0 0 auto; }
  .sep { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 3px 8px; }
</style>
</head>
<body>
<div id="menu"></div>
<script>
  const { onItems, sendClick, sendClose, sendSize } = window.contextMenuBridge;
  const menu = document.getElementById("menu");
  let count = 0;

  // Monochrome line icons, keyed by what menu.js asks for. Stroke inherits the
  // row colour so hover and danger states recolour the glyph with the label.
  const SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  const ICONS = {
    chat: SVG + '<path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>',
    settings: SVG + '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
    eye: SVG + '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
    monitor: SVG + '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    power: SVG + '<path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>',
  };

  function iconFor(key) {
    if (!key) return "";
    // Unknown keys (and the legacy emoji values) still render: fall back to the
    // raw string so a missing glyph never blanks a row.
    return ICONS[key] || `<span>${key}</span>`;
  }

  function render(items) {
    menu.innerHTML = "";
    count = 0;
    for (const it of items) {
      // CRITICAL: count must advance for separators too — the main process
      // looks up click handlers by the FULL item index. Rendering rows only
      // shifted every index after the first separator by one (clicking
      // "Dashboard" triggered "auto-approve", clicking anything after a
      // separator did nothing).
      if (it.type === "separator") {
        const s = document.createElement("div");
        s.className = "sep";
        menu.appendChild(s);
        count++;
        continue;
      }
      const idx = count;
      count++;

      const row = document.createElement("div");
      row.className = "item" + (it.danger ? " danger" : "") + (it.disabled ? " disabled" : "");
      if (it.icon) {
        const ic = document.createElement("span");
        ic.className = "icon";
        ic.innerHTML = iconFor(it.icon);
        row.appendChild(ic);
      }
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = it.label;
      row.appendChild(label);
      if (it.checked) {
        const chk = document.createElement("span");
        chk.className = "check";
        chk.textContent = "✓";
        row.appendChild(chk);
      }
      if (!it.disabled) {
        row.addEventListener("click", () => { sendClick(idx); });
      }
      menu.appendChild(row);
    }
    // Fade in — without this the menu renders at opacity:0 (invisible
    // window over the desktop = "right-click does nothing").
    requestAnimationFrame(() => {
      sendSize(menu.offsetWidth, menu.offsetHeight);
      menu.classList.add("show");
    });
  }

  window.addEventListener("keydown", (e) => { if (e.key === "Escape") sendClose(); });
  window.addEventListener("blur", () => sendClose());
  onItems((items) => { render(items); });
</script>
</body>
</html>
